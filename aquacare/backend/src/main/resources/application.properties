# ---------------------------------------------------------------
# AquaCare backend configuration
# Every value can be overridden with an environment variable,
# e.g.  DB_PASSWORD=secret mvn spring-boot:run
# Never commit a real password here.
# ---------------------------------------------------------------

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aquacare?useSSL=false&serverTimezone=Asia/Hong_Kong&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Do not fail at startup if MySQL is not running yet; /api/health reports it.
spring.datasource.hikari.initialization-fail-timeout=-1

# JSON uses snake_case so field names match the database columns
# (tank_id, tank_name, next_due_date, ...).
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Hong_Kong

# Allowed origins for a frontend served from another port (comma separated).
app.cors.allowed-origins=${CORS_ORIGINS:*}
